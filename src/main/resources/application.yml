spring:
  application:
    name: property-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}

server:
  servlet:
    context-path: /property-manager
  port: 8082
  address: 0.0.0.0
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: http://localhost:4178,https://www.landlord.tante.tz,http://localhost:8080,http://localhost:4173,http://192.168.1.81:4173,http://localhost:4173,http://localhost:4175
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: Authorization,Content-Type,Accept,Origin
    exposed-headers: Authorization
    allow-credentials: true
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:property-manager-images}
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      endpoint: ""
      public-url-base: ""
      folder: ${AWS_S3_FOLDER:properties}
